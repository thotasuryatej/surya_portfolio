<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (no flash). Dark is the primary presentation; light is the
      // visitor's choice from the toggle. Kept in sync with src/lib/theme.ts.
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.dataset.theme = t;
      })();
      // A reload starts at the top. The browser's own scroll restoration lands in the wrong place (sections
      // below the fold only estimate their height until drawn), and a section link left in the URL would
      // jump there again. A case study link (#project/…) is kept, so its dialog reopens.
      (function () {
        try {
          history.scrollRestoration = 'manual';
          var nav = performance.getEntriesByType('navigation')[0];
          if (nav && nav.type === 'reload' && location.hash && location.hash.indexOf('#project/') !== 0)
            history.replaceState(null, '', location.pathname + location.search);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=st" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=st" />
    <!-- Saved to the home screen, the site opens full screen without the browser bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Surya Tej" />
    <!--seo-->
  </head>

    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#eee8de;background:#0b0a09">
        <!--plain-->

          <a style="color:#7fe3ff" href="resume/Surya-Tej-Resume.pdf">download my resume</a> or
          <a style="color:#7fe3ff" href="mailto:thotasuryatej@gmail.com">email me</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
