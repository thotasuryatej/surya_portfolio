<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Surya Tej Thota</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=st" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=st" />
    <script>
      // GitHub Pages serves this for any missing path. Same saved theme as the main site (src/lib/theme.ts).
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      })();
    </script>
    <style>
      /* Colours from src/styles/tokens.css */
      :root {
        color-scheme: dark;
        --bg: #0b0a09;
        --text: #eee8de;
        --text-hi: #fffaf1;
        --text-3: #918a80;
        --accent: #e8b058;
        --accent-rgb: 232 176 88;
        --copper-rgb: 214 142 88;
        --line: rgb(236 226 210 / 0.16);
        --on-accent: #1a1206;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f5f2eb;
        --text: #16181c;
        --text-hi: #0a0b0d;
        --text-3: #53565c;
        --accent: #1e4e9c;
        --accent-rgb: 30 78 156;
        --copper-rgb: 160 92 40;
        --line: rgb(28 30 36 / 0.16);
        --on-accent: #ffffff;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(40rem 26rem at 50% 30%, rgb(var(--accent-rgb) / 0.1), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: 'Geist Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 32rem; display: grid; gap: 18px; justify-items: center; }
      .code {
        font-family: ui-monospace, 'Geist Mono Variable', SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(4.5rem, 3rem + 8vw, 7.5rem);
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.06em;
        color: var(--text-hi);
      }
      .code span { color: var(--accent); }
      .kicker {
        font-family: ui-monospace, 'Geist Mono Variable', SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      h1 { font-size: clamp(1.35rem, 1.1rem + 1vw, 1.8rem); font-weight: 600; letter-spacing: -0.03em; color: var(--text-hi); }
      p { line-height: 1.6; color: var(--text-3); }
      .trace { width: min(260px, 70vw); height: 1px; background: linear-gradient(90deg, transparent, rgb(var(--accent-rgb) / 0.7), rgb(var(--copper-rgb) / 0.5), transparent); }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 6px; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
      }
      a.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
      a:hover { border-color: rgb(var(--accent-rgb) / 0.6); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">The Inventor's Lab</p>
      <p class="code" aria-hidden="true">4<span>0</span>4</p>
      <div class="trace"></div>
      <h1>This page isn't on the bench</h1>
      <p>The link may be old or mistyped. Everything on the site is on the main page.</p>
      <div class="actions">
        <a class="primary" href="/">Back to the home page</a>
        <a href="/#projects">See the projects</a>
      </div>
    </main>
  </body>
</html>
